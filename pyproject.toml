[project]
name = "torpool"
version = "0.2.0"
description = "Multi-circuit Tor HTTP and BitTorrent downloader for defensive threat-intelligence analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Systems Engineering" }]
dependencies = [
    "cryptography>=50.0.2",
    "httpx[socks]>=0.28.1",
    "rich>=15.0.0",
    "stem>=1.8.2",
    "typer>=0.29.0",
]

[project.scripts]
torpool = "torpool.cli:app"

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hatchling>=1.33.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: marks tests as requiring live Tor or network environment (run with TORPOOL_INTEGRATION=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
files = ["src/torpool", "tests"]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
warn_return_any = false
warn_unused_configs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["stem", "stem.*"]
ignore_missing_imports = true
